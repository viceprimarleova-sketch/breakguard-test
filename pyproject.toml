[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakguard"
version = "0.1.0"
description = "Detect and conservatively repair known Shopify API deprecations in source repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "BreakGuard" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
breakguard = "breakguard.cli:main"

[tool.setuptools]
packages = ["breakguard"]

[tool.setuptools.package-data]
breakguard = ["rules/*.json"]
