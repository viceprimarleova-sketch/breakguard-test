[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breakguard"
dynamic = ["version"]
description = "Detect and conservatively repair known Shopify API deprecations in source repositories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["graphql-core>=3.2,<3.3"]
license = "LicenseRef-Proprietary"
authors = [
  { name = "BreakGuard" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
breakguard = "breakguard.cli:main"

[tool.setuptools]
packages = ["breakguard", "breakguard.rules"]

[tool.setuptools.dynamic]
version = { attr = "breakguard.__version__" }

[tool.setuptools.package-data]
"breakguard.rules" = ["*.json"]
