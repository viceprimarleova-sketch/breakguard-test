name: BreakGuard Single Artifact Verification

on:
  pull_request:
    branches:
      - breakguard/product-v0.1
  push:
    branches:
      - breakguard/product-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kit:
    name: Build one canonical evaluation kit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pinned delivery wheels
        run: |
          python -m pip install --upgrade pip
          mkdir -p ../evaluation-wheels ../evaluation-output
          python -m pip wheel --no-deps --wheel-dir ../evaluation-wheels .
          python -m pip download --only-binary=:all: --no-deps --dest ../evaluation-wheels graphql-core==3.2.13
      - name: Build canonical ZIP once
        id: build
        run: |
          python scripts/build_pilot_kit.py --wheel-dir ../evaluation-wheels --out-dir ../evaluation-output
          archive="$(find ../evaluation-output -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          sha256sum "$archive"
      - name: Upload canonical ZIP
        uses: actions/upload-artifact@v4
        with:
          name: breakguard-canonical-evaluation-kit
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  verify-same-kit:
    name: Verify same ZIP - ${{ matrix.os }}
    needs: build-kit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout verifier at exact candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the single canonical ZIP
        uses: actions/download-artifact@v4
        with:
          name: breakguard-canonical-evaluation-kit
          path: ../canonical-kit
      - name: Install and verify the exact downloaded ZIP offline
        shell: bash
        run: |
          archive="$(find ../canonical-kit -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          python scripts/check_prebuilt_kit.py "$archive"
