name: BreakGuard External Install Smoke

on:
  push:
    branches:
      - breakguard/product-v0.1
  workflow_dispatch:

jobs:
  external-install:
    name: External install - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install BreakGuard exactly like an external tester
        run: python -m pip install "git+https://github.com/viceprimarleova-sketch/breakguard-test.git@breakguard/product-v0.1"

      - name: Verify installed command and bundled rules
        run: |
          breakguard --version
          breakguard --help
          python -c "from breakguard.cli import default_rules_path; p=default_rules_path(); assert p.exists(), p; print(p)"

      - name: Create a disposable vulnerable fixture
        run: python -c "from pathlib import Path; p=Path('bg-fixture'); p.mkdir(exist_ok=True); (p/'query.graphql').write_text('lastIncompleteCheckout { id }\n', encoding='utf-8')"

      - name: Confirm scan detects the fixture
        run: python -c "import subprocess; r=subprocess.run(['breakguard','bg-fixture','--json']); raise SystemExit(0 if r.returncode == 1 else 1)"

      - name: Confirm preview shows a diff without changing source
        run: python -c "import subprocess; from pathlib import Path; p=Path('bg-fixture/query.graphql'); before=p.read_text(); r=subprocess.run(['breakguard','bg-fixture','--fix-preview'], capture_output=True, text=True); assert r.returncode == 1; assert '--- a/query.graphql' in r.stdout; assert '+++ b/query.graphql' in r.stdout; assert p.read_text() == before"

      - name: Confirm conservative autofix clears the supported finding
        run: breakguard bg-fixture --apply-fixes
