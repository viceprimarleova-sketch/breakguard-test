name: BreakGuard Autofix Dry Run

on:
  push:
    branches:
      - breakguard/product-v0.1
  pull_request:
    branches:
      - main

jobs:
  autofix-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: breakguard/product-v0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Configure git
        run: |
          git config user.name "breakguard-bot"
          git config user.email "breakguard-bot@users.noreply.github.com"

      - name: Create disposable vulnerable fixture branch
        run: |
          git checkout -B breakguard/ci-fixture main
          mkdir -p shopify
          cat > shopify/queries.graphql <<'EOF'
          query CustomerCheckout($id: ID!) {
            customer(id: $id) {
              id
              lastIncompleteCheckout {
                id
              }
            }
          }

          query DraftOrderWarning($id: ID!) {
            draftOrder(id: $id) {
              warnings {
                __typename
                ... on DraftOrderDiscountNotAppliedWarning {
                  priceRule
                }
              }
            }
          }
          EOF
          cat > shopify/legacy.js <<'EOF'
          admin.rest.resources.ScriptTag.create({})
          EOF
          git add shopify
          git commit -m "Add CI fixture for BreakGuard"

      - name: Exercise safe branch preparation
        run: |
          python -m breakguard.github_pr             --base breakguard/ci-fixture             --branch breakguard/ci-autofix             --verify-cmd "python -m pytest -q"             --dry-run

      - name: Verify expected repair result
        run: |
          ! grep -R "lastIncompleteCheckout" shopify/queries.graphql
          ! grep -R "priceRule" shopify/queries.graphql
          grep -R "discountTitle" shopify/queries.graphql
          grep -R "discountCode" shopify/queries.graphql
          grep -R "ScriptTag" shopify/legacy.js
