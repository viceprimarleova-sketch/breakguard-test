name: BreakGuard CI

on:
  push:
    branches:
      - main
      - breakguard/**
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Verify installed CLI
        run: |
          breakguard --version
          breakguard --help
          python -c "from breakguard.cli import default_rules_path; assert default_rules_path().exists()"

      - name: Run BreakGuard tests
        run: python -m pytest -q
