name: BreakGuard CI

on:
  push:
    branches:
      - main
      - breakguard/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Verify installed CLI
        run: |
          breakguard --help
          python -c "from breakguard.cli import default_rules_path; assert default_rules_path().exists()"

      - name: Run BreakGuard tests
        run: python -m pytest -q
